{% extends "base.html" %}{% block page_title %}Invite teammate{% endblock %}{% block content %}
<h2>Invite teammate</h2>{% if invitation_url %}<div class="kargul-card" style="padding:16px;margin:16px 0"><strong>Copy this invitation link</strong><p><input class="jira-input" readonly value="{{ invitation_url }}"></p></div>{% endif %}
<form method="post" class="kargul-card" style="padding:16px;max-width:640px">{% csrf_token %}{{ form.as_p }}<button class="kargul-btn kargul-btn-primary">Create invitation</button></form>
{% endblock %}
